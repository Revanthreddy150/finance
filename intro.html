<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE NAVEEN FINANCE | Official Reveal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f8fafc;
      color: #0f172a;
      overflow: hidden;
      min-height: 100vh;
    }

    /* 3D Background Canvas */
    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .ui-layer {
      position: relative;
      z-index: 10;
      pointer-events: none;
    }

    /* Light Glassmorphism Badge */
    .light-glass {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
    }

    /* Crisp Gradient Typography */
    .brand-title {
      background: linear-gradient(135deg, #0284c7 0%, #0f172a 45%, #059669 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Clean 3D Scale & Bounce Logo Animation */
    @keyframes cleanLogoBounce {
      0% {
        transform: translateY(-200px) scale(0.1) rotate(-20deg);
        opacity: 0;
      }
      60% {
        transform: translateY(15px) scale(1.1) rotate(6deg);
        opacity: 1;
      }
      80% {
        transform: translateY(-8px) scale(0.96) rotate(-2deg);
      }
      100% {
        transform: translateY(0) scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    .animate-clean-logo {
      animation: cleanLogoBounce 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Premium Logo Metallic Shine Effect */
    .logo-container {
      position: relative;
      overflow: hidden;
    }

    .logo-container::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -150%;
      width: 100%;
      height: 200%;
      background: linear-gradient(
        60deg, 
        transparent 30%, 
        rgba(255, 255, 255, 0.75) 50%, 
        transparent 70%
      );
      transform: rotate(25deg);
      pointer-events: none;
    }

    @keyframes logoShineSwipe {
      0% { left: -150%; }
      100% { left: 150%; }
    }

    .trigger-shine::after {
      animation: logoShineSwipe 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* Title Slide Down Entrance Animation */
    .reveal-title-box {
      transform: translateY(-25px) scale(0.94);
      opacity: 0;
      transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reveal-title-box.active {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    /* Fade Elements */
    .fade-element {
      opacity: 0;
      transform: translateY(20px);
      transition: all 1s ease-out;
    }

    .fade-element.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Continuous Rotating Loading Circle */
    @keyframes spinnerRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-spinner {
      animation: spinnerRotate 0.85s linear infinite;
    }
  </style>
</head>
<body class="relative min-h-screen flex flex-col justify-between p-6 sm:p-12 text-center">

  <!-- 3D Particle Background Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer fixed inset-0 flex flex-col justify-between p-6 sm:p-12 text-center">
    
    <!-- Top Header Badge -->
    <div class="pt-4">
      <span id="top-badge" class="fade-element inline-block px-6 py-2 rounded-full light-glass text-[11px] sm:text-xs font-extrabold tracking-[0.25em] text-emerald-800 uppercase">
        FINANCIAL EMPOWERMENT
      </span>
    </div>

    <!-- Center Section: Animated Logo with Shine + Pulled Title -->
    <div class="my-auto flex flex-col items-center justify-center space-y-6">
      
      <!-- Logo Container with Metallic Shine Effect -->
      <div id="brand-logo" class="logo-container opacity-0 rounded-3xl">
        <img 
          src="https://file.garden/abrK4_rpWxJegn7w/Gemini_Generated_Image_xopud6xopud6xopu.png" 
          alt="THE NAVEEN FINANCE Logo" 
          class="w-24 h-24 sm:w-32 sm:h-32 rounded-3xl object-cover border-2 border-slate-200/80 shadow-lg"
        />
      </div>

      <!-- Brand Title -->
      <div id="brand-title-container" class="reveal-title-box flex flex-col items-center">
        <h1 class="text-4xl sm:text-7xl md:text-8xl font-black tracking-tight brand-title">
          NAVEEN FINANCE
        </h1>
        <p id="sub-title" class="fade-element text-xs sm:text-base text-slate-600 font-extrabold tracking-[0.35em] uppercase mt-4">
          SMART PORTFOLIO & WEALTH MANAGEMENT
        </p>
      </div>

    </div>

    <!-- Bottom Rotating Loading Circle -->
    <div id="loader-wrapper" class="fade-element pb-8 flex flex-col items-center">
      <div class="w-10 h-10 border-4 border-slate-300/60 border-t-sky-600 border-r-emerald-500 rounded-full loading-spinner shadow-sm"></div>
    </div>

  </div>

  <!-- Three.js Background Engine -->
  <script>
    const canvas = document.getElementById('webgl-canvas');

    // Scene & Camera Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8fafc);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 15);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Ambient Floating Particles
    const particlesCount = 400;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particlesCount * 3);

    for (let i = 0; i < particlesCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 20;
      positions[i + 1] = (Math.random() - 0.5) * 20;
      positions[i + 2] = (Math.random() - 0.5) * 20;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const particleMat = new THREE.PointsMaterial({
      size: 0.08,
      color: 0x0284c7,
      transparent: true,
      opacity: 0.25
    });

    const particleSystem = new THREE.Points(particleGeo, particleMat);
    scene.add(particleSystem);

    // Sequence Trigger Logic
    function triggerSequence() {
      // Step 1: Logo Drops Down with Spring/Bounce Animation
      setTimeout(() => {
        const logo = document.getElementById('brand-logo');
        logo.classList.remove('opacity-0');
        logo.classList.add('animate-clean-logo');
        document.getElementById('top-badge').classList.add('active');
      }, 300);

      // Step 2: Trigger Metallic Shine Swipe on Logo
      setTimeout(() => {
        const logo = document.getElementById('brand-logo');
        logo.classList.add('trigger-shine');
      }, 1200);

      // Step 3: Name Follows & Pulled Below Logo
      setTimeout(() => {
        document.getElementById('brand-title-container').classList.add('active');
      }, 850);

      // Step 4: Subtitle & Bottom Rotating Circle Fade In
      setTimeout(() => {
        document.getElementById('sub-title').classList.add('active');
        document.getElementById('loader-wrapper').classList.add('active');
      }, 1600);
    }

    // Animation Render Loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // Subtle Background Particle Motion
      particleSystem.rotation.y = elapsedTime * 0.02;
      particleSystem.rotation.x = Math.sin(elapsedTime * 0.5) * 0.02;

      renderer.render(scene, camera);
    }

    animate();
    window.addEventListener('DOMContentLoaded', triggerSequence);

    // Responsive Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
