<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRI FINANCE - Select Server</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #005b66;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 30px;
            color: #005b66;
            text-transform: uppercase;
        }

        .card {
            width: 100%;
            max-width: 350px;
            border: 2px solid #005b66;
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(0, 91, 102, 0.08);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #005b66;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            color: #005b66;
            background-color: #ffffff;
            border: 2px solid #005b66;
            border-radius: 25px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn:active {
            background-color: #005b66;
            color: #ffffff;
        }

        .btn-primary {
            background-color: #005b66;
            color: #ffffff;
        }

        .btn-primary:active {
            background-color: #00424a;
        }
    </style>
</head>
<body>

    <div class="header-title">SRI FINANCE</div>

    <div class="card">
        <div class="card-title">Select Server to Continue</div>
        
        <div class="btn-container">
            <a href="https://revanthreddy150.github.io/finance/user10" class="btn btn-primary">Server 1</a>
            <a href="https://srifinance.ct.ws/" class="btn" target="_blank" rel="noopener noreferrer">Server 2</a>
        </div>
    </div>

</body>
</html>
